<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Project — Stephy</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="nav dark-bg">
  <a href="index.html" class="brand">STEPHY</a>
  <div class="nav-links">
    <a href="index.html" data-page="index.html">HOME</a>
    <span class="sep">/</span>
    <a href="work.html" data-page="work.html">WORK</a>
    <span class="sep">/</span>
    <a href="reels.html" data-page="reels.html">REELS</a>
    <span class="sep">/</span>
    <a href="about.html" data-page="about.html">ABOUT</a>
    <span class="sep">/</span>
    <a href="contact.html" data-page="contact.html">CONTACT</a>
  </div>
</nav>

<section class="detail-hero">
  <img id="detailHeroImg" src="" alt="">
  <div class="detail-hero-overlay"></div>
  <div class="detail-hero-content">
    <h1 class="detail-title" id="detailTitle"></h1>
    <div class="detail-meta" id="detailMeta"></div>
  </div>
</section>

<div class="detail-body">
  <p class="detail-desc" id="detailDesc"></p>
  <div class="detail-credits" id="detailCredits"></div>
</div>

<div class="detail-gallery" id="detailGallery"></div>

<div class="detail-footer">
  <a href="#" class="btn-outline" id="watchFullFilmLink" target="_blank" rel="noopener">
    WATCH FULL FILM
  </a>
  <a href="#" class="next-project" id="nextProjectLink">NEXT PROJECT →</a>
</div>

<script src="js/projects.js"></script>
<script>
  const params = new URLSearchParams(window.location.search);
  const id = params.get('id') || '1';
  const project = PROJECTS[id] || PROJECTS[1];

  document.title = project.title + " — Stephy";
  document.getElementById('detailHeroImg').src = project.image;
  document.getElementById('detailHeroImg').alt = project.title;
  document.getElementById('detailTitle').textContent = project.title;
  document.getElementById('detailMeta').innerHTML =
    `${project.type.toUpperCase()} <span>·</span> ${project.year} <span>·</span> ${project.role.toUpperCase()}`;
  document.getElementById('detailDesc').textContent = project.description;
  document.getElementById('watchFullFilmLink').href = project.watchUrl || "#";

  const creditsEl = document.getElementById('detailCredits');
  Object.entries(project.credits).forEach(([label, value]) => {
    const row = document.createElement('div');
    row.className = 'detail-credit-row';
    row.innerHTML = `<span class="detail-credit-label">${label.toUpperCase()}</span><span class="detail-credit-value">${value}</span>`;
    creditsEl.appendChild(row);
  });

  const galleryEl = document.getElementById('detailGallery');
  const captions = ["Behind the scenes", "On location", "Final setup", "Director's eye"];
  captions.forEach((cap) => {
    const fig = document.createElement('figure');
    fig.innerHTML = `<img src="${project.image}" alt="${project.title} still"><div class="gallery-caption">${cap}</div>`;
    galleryEl.appendChild(fig);
  });

  const ids = Object.keys(PROJECTS).map(Number);
  const nextId = ids[(ids.indexOf(Number(id)) + 1) % ids.length];
  document.getElementById('nextProjectLink').href = `work-detail.html?id=${nextId}`;
</script>
<script src="js/main.js"></script>
</body>
</html>
